<style>
:root{
  --bg:#100e0c; --bg2:#171310; --card:#211c16; --card2:#2a231b;
  --ink:#f5efe4; --ink-dim:#b7ac99; --ink-faint:#7d7365;
  --amber:#ffb000; --amber-soft:#ffcf5c; --amber-deep:#c98a00;
  --line:rgba(245,239,228,.14); --line-strong:rgba(245,239,228,.28);
  --good:#8fbc7a; --meh:#d96a5f; --great:#ffb000;
  --radius:18px; --phone:390px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#0a0807; color:var(--ink); font-family:Inter,system-ui,sans-serif; font-size:15px; line-height:1.45;}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
img,svg{display:block; max-width:100%}
.mono{font-family:"IBM Plex Mono",monospace}
.anton{font-family:Anton,Impact,sans-serif; font-weight:400; letter-spacing:.01em}

/* ---------- phone column ---------- */
.phone{max-width:var(--phone); margin:0 auto; background:var(--bg); min-height:100vh; position:relative;
  box-shadow:0 0 0 1px rgba(245,239,228,.07), 0 0 80px rgba(0,0,0,.8);}
.stage{padding-bottom:96px} /* room for thumb rail */
.desktop-note{display:none}

/* ---------- header ---------- */
header.top{position:sticky; top:0; z-index:40; background:rgba(16,14,12,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.top-in{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px;}
.wordmark{font-family:Anton,Impact,sans-serif; font-size:34px; line-height:.9; letter-spacing:.02em; color:var(--ink);}
.wordmark em{font-style:normal; color:var(--amber)}
.wordmark small{display:block; font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.32em; color:var(--ink-dim); margin-top:3px}
.lang-pill{display:flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden; font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:700}
.lang-pill button{padding:6px 10px; color:var(--ink-dim)}
.lang-pill button.on{background:var(--amber); color:#171207}

/* ---------- search + switches ---------- */
.toolbar{padding:12px 16px 4px; position:sticky; top:61px; z-index:39; background:linear-gradient(var(--bg) 82%, transparent);}
.search{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line-strong);
  border-radius:999px; padding:12px 14px;}
.search input{flex:1; background:none; border:0; outline:0; color:var(--ink); font:600 15px Inter,sans-serif; min-width:0}
.search input::placeholder{color:var(--ink-faint)}
.search .mag{color:var(--amber); font-size:17px}
.search .clr{display:none; color:var(--ink-dim); font-size:18px; line-height:1}
.search.has-text .clr{display:block}
.switches{display:flex; gap:8px; margin-top:10px}
.switch{display:flex; align-items:center; gap:7px; border:1px solid var(--line-strong); border-radius:999px;
  padding:7px 12px; font:600 12px Inter,sans-serif; color:var(--ink-dim); background:var(--card)}
.switch .knob{width:26px; height:15px; border-radius:99px; background:#3a322a; position:relative; flex:none}
.switch .knob::after{content:""; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:var(--ink-dim); transition:.18s}
.switch.on{color:var(--amber); border-color:var(--amber)}
.switch.on .knob{background:var(--amber-deep)}
.switch.on .knob::after{left:13px; background:#171207}

/* ---------- day strip ---------- */
.daystrip{display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:none; width:52px; border:1px solid var(--line); border-radius:14px; padding:8px 0 7px; text-align:center; background:var(--card)}
.day .dw{font:700 10px "IBM Plex Mono",monospace; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase}
.day .dn{font:700 19px Anton,Impact,sans-serif; line-height:1.1; margin-top:1px}
.day .dm{font:500 10px "IBM Plex Mono",monospace; color:var(--ink-faint)}
.day.on{background:var(--amber); border-color:var(--amber); color:#171207}
.day.on .dw,.day.on .dm{color:rgba(23,18,7,.65)}
.day.today{border-color:var(--amber)}

/* ---------- section labels ---------- */
.sec-label{padding:18px 16px 10px; font:700 11px "IBM Plex Mono",monospace; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-dim); display:flex; justify-content:space-between; align-items:baseline}
.sec-label b{color:var(--amber); font-weight:700}
.sec-label .count{letter-spacing:.08em; color:var(--ink-faint)}

/* ---------- film programme rows ---------- */
.filmrow{display:block; margin:0 12px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.filmrow:active{transform:scale(.985)}
.filmrow .art{position:relative; height:148px; overflow:hidden}
.filmrow .art svg{width:100%; height:100%}
.filmrow .art .art-title{position:absolute; left:14px; right:14px; bottom:10px}
.filmrow .art .art-title h2{font:400 30px/1 Anton,Impact,sans-serif; text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,.65)}
.filmrow .art .art-title p{font:600 12px Inter,sans-serif; color:rgba(245,239,228,.85); margin-top:2px}
.filmrow .art .cin-count{position:absolute; top:10px; left:12px; font:700 10px "IBM Plex Mono",monospace; letter-spacing:.12em; white-space:nowrap;
  background:rgba(0,0,0,.55); padding:5px 8px; border-radius:99px; color:var(--ink)}
.tag-new{position:absolute; top:10px; right:12px; background:var(--amber); color:#171207; font:700 10px "IBM Plex Mono",monospace;
  letter-spacing:.14em; padding:5px 9px; border-radius:99px}
.tag-new-inline{display:inline-block; background:var(--amber); color:#171207; font:700 10px "IBM Plex Mono",monospace;
  letter-spacing:.14em; padding:4px 8px; border-radius:99px; margin-bottom:9px}
.filmrow .body{padding:12px 14px 14px}
.verdict{display:flex; align-items:baseline; gap:8px}
.verdict .big{font:400 30px/1 Anton,Impact,sans-serif; color:var(--amber)}
.verdict .src{font:700 10px "IBM Plex Mono",monospace; letter-spacing:.12em; color:var(--ink-dim)}
.verdict .word{font:700 11px Inter,sans-serif; letter-spacing:.06em; padding:3px 8px; border-radius:99px; border:1px solid}
.verdict .word.great{color:var(--great); border-color:var(--great)}
.verdict .word.good{color:var(--good); border-color:var(--good)}
.verdict .word.meh{color:var(--meh); border-color:var(--meh)}
.verdict .others{margin-left:auto; font:500 11px "IBM Plex Mono",monospace; color:var(--ink-faint); text-align:right; line-height:1.5}
.next-times{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; align-items:center}
.next-times .lbl{font:700 10px "IBM Plex Mono",monospace; letter-spacing:.16em; color:var(--ink-faint); margin-right:2px}
.time-chip{font:700 13px "IBM Plex Mono",monospace; border:1px solid var(--line-strong); border-radius:99px; padding:6px 10px; background:var(--bg2); white-space:nowrap}
.time-chip.next{background:var(--amber); border-color:var(--amber); color:#171207}
.time-chip .fmt{color:var(--amber-soft); font-size:10px; margin-left:4px}
.time-chip.next .fmt{color:#171207}
.time-chip .dub{color:#ff8d80; font-size:10px; margin-left:4px}
.more-link{font:600 12px Inter,sans-serif; color:var(--amber)}
.noscores{margin-top:11px; border:1px dashed var(--line-strong); border-radius:12px; padding:10px 12px; font:500 12.5px Inter,sans-serif; color:var(--ink-dim)}
.noscores b{color:var(--amber)}

/* ---------- editorial cards ---------- */
.edcard{margin:0 12px 14px; border-radius:var(--radius); padding:16px; position:relative; overflow:hidden}
.edcard.stub{background:var(--amber); color:#171207}
.edcard.stub::before,.edcard.stub::after{content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:var(--bg); top:50%; margin-top:-11px}
.edcard.stub::before{left:-11px}.edcard.stub::after{right:-11px}
.edcard.stub .kicker{font:700 10px "IBM Plex Mono",monospace; letter-spacing:.26em}
.edcard.stub h3{font:400 24px/1.05 Anton,Impact,sans-serif; text-transform:uppercase; margin:6px 0}
.edcard.stub p{font:500 13.5px/1.5 Inter,sans-serif; color:rgba(23,18,7,.8)}
.edcard.stub .sig{font:700 11px "IBM Plex Mono",monospace; margin-top:10px; letter-spacing:.1em}
.edcard.legend{background:var(--card); border:1px solid var(--line)}
.edcard.legend h3{font:700 11px "IBM Plex Mono",monospace; letter-spacing:.26em; color:var(--ink-dim); margin-bottom:10px}
.edcard.legend .row{display:flex; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:13px}
.edcard.legend .row:first-of-type{border-top:0}

 else{
  let list;
  if(state.tab==="today"){list=DATA.films.filter(f=>nextTimes(f,state.day).some(x=>state.day==="2026-11-05"?x.t>NOW:true)).sort((a,b)=>(verdict(b)?.v||0)-(verdict(a)?.v||0))}
  else if(state.tab==="new"){list=DATA.films.filter(f=>f.is_new).sort((a,b)=>((verdict(b)?.v||0)-(verdict(a)?.v||0))||(b.year-a.year))}
  else{const top3=DATA.top3.map(id=>filmById(id)); const rest=DATA.films.filter(f=>!DATA.top3.includes(f.id)).sort((a,b)=>(verdict(b)?.v||0)-(verdict(a)?.v||0)); list=[...top3,...rest]}
  list=openAirOnly(filteredFilms(list));
  const label={today:t("tonight"),new:t("new"),all:t("all"),cinemas:t("cinemas")}[state.tab];
  body+=`<div class="sec-label"><span>${label}</span><span class="count">${list.length} FILMS</span></div>`;
  if(!list.length)body+=`<div class="empty"><b>${state.tab==="new"?t("no_new"):t("no_films")}</b>${state.q?`Nothing matches “${esc(state.q)}”.`:""}</div>`;
  list.forEach((f,i)=>{body+=filmRowHTML(f);
   if(state.tab==="all"&&i===2){body+=mascotHTML(filmById(DATA.mascot_pick))+legendHTML()}
   if(state.tab==="all"&&i===5){body+=`<div class="countline">· · · &nbsp;<b>${DATA.films.length}</b> films screening this week in ${esc(DATA.city)}&nbsp; · · ·</div>`}});
 }
 return headerHTML()+toolbarHTML(ph)+(state.tab!=="cinemas"?dayStripHTML():"")+body}
function cinemasHTML(){
 const q=state.q.toLowerCase();
 let list=DATA.cinemas.filter(c=>!q||c.name.toLowerCase().includes(q)||c.area.toLowerCase().includes(q));
 if(state.summer)list=list.filter(c=>c.type==="summer");
 const lats=DATA.cinemas.map(c=>c.lat), lngs=DATA.cinemas.map(c=>c.lng);
 const minLa=Math.min(...lats), maxLa=Math.max(...lats), minLn=Math.min(...lngs), maxLn=Math.max(...lngs);
 const padLa=(maxLa-minLa)*.12, padLn=(maxLn-minLn)*.12;
 const X=lng=>Math.min(92,Math.max(8,((lng-(minLn-padLn))/((maxLn+padLn)-(minLn-padLn))*100))).toFixed(1);
 const Y=lat=>Math.min(90,Math.max(10,(((maxLa+padLa)-lat)/((maxLa+padLa)-(minLa-padLa))*100))).toFixed(1);
 const pins=list.map(c=>{const x=X(c.lng),y=Y(c.lat);
  return `<a href="#/cinema/${c.id}"><g><circle cx="${x}" cy="${y}" r="5.5" fill="${c.type==="summer"?"#ffb000":"#f5efe4"}" stroke="#100e0c" stroke-width="1.4"/><text x="${x}" y="${+y+1.5}" text-anchor="middle" font-size="4.2" font-weight="700" fill="#100e0c" font-family="IBM Plex Mono,monospace">${c.films_today||"—"}</text></g></a>`}).join("");
 const youX=X(9.0966), youY=Y(48.7012);
 let out=`<div class="sec-label"><span>${t("map")}</span><span class="count">${list.length} CINEMAS</span></div>
 <div class="mapwrap"><svg viewBox="0 0 100 62" role="img" aria-label="Schematic map of cinemas"><rect width="100" height="62" fill="#14100d"/><path d="M0 34 Q 25 28 50 36 T 100 30" stroke="#2a231b" stroke-width="5" fill="none"/><path d="M48 0 Q 52 30 46 62" stroke="#2a231b" stroke-width="4" fill="none"/><circle cx="${youX}" cy="${youY}" r="2.2" fill="#ffb000"/><text x="${+youX+3}" y="${+youY+1.4}" font-size="3.8" fill="#b7ac99" font-family="IBM Plex Mono,monospace">YOU · CITY CENTRE</text>${pins}</svg>
 <div class="mapbar"><span>${t("map")} · ${esc(DATA.city)}</span><button data-act="map">${t("expand")}</button></div></div>`;
 AREAS.forEach(a=>{const rows=list.filter(c=>c.area===a); if(!rows.length)return;
  out+=`<div class="area-h">${esc(a.toUpperCase())}</div>`;
  rows.forEach(c=>{out+=`<a class="cinrow${c.films_today?"":" dim"}" href="#/cinema/${c.id}"><div><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.area)} · ${t("halls")(c.halls)}${state.near?` · ${t("dist")(distKm(c))}`:""}</div></div>
  <div class="chips"><span class="nfilms">${c.films_today?c.films_today+" films":"no films today"}</span><span>${c.type==="summer"?`<span class="chip amber">☀ ${t("openair")}</span>`:""}${c.formats.map(f=>`<span class="chip dim">${esc(f)}</span>`).join("")}</span></div></a>`})});
 if(!list.length)out+=`<div class="empty"><b>${t("no_cin")}</b></div>`;
 out+=`<div class="edcard legend fmt-legend"><h3>${t("formats")}</h3>
 <div class="row"><span class="chip amber">IMAX</span><span>giant screen, big sound</span></div>
 <div class="row"><span class="chip amber">35mm</span><span>film print, not digital</span></div>
 <div class="row"><span class="chip amber">4DX · Dolby Atmos</span><span>moving seats / immersive sound</span></div></div>`;
 return out}

/* ---------- film page ---------- */
function filmHTML(id){const f=filmById(id); if(!f)return notFoundHTML();
 const v=verdict(f); const st=DATA.film_showtimes[f.id]||[];
 const groups={}; st.forEach(s=>{(groups[s.area]=groups[s.area]||[]).push(s)});
 return headerHTML()+`<a class="backlink" href="#/home/all">${t("back")}</a>
 <div class="filmhero"><div class="poster">${posterSVG(f)}</div><div><h1>${esc(f.title)}</h1>
 ${f.original_title&&f.original_title!==f.title?`<div class="second-title">${esc(f.original_title)}</div>`:""}
 <div class="dir">${esc(f.director)} · ${f.year}</div><div class="cast">${esc(f.cast.slice(0,5).join(", "))}</div>
 <div class="meta2">${esc(f.genres.join(" · "))} · ${f.runtime} min${f.original_title&&f.original_title!==f.title?" · "+esc(f.original_title):""}</div>
 <div class="chips-row">${f.is_new?`<span class="chip amber">NEW</span>`:""}${f.imdb?`<span class="chip ${grade(f.imdb)}">IMDb ${f.imdb.toFixed(1)}</span>`:""}${f.rt?`<span class="chip ${grade(f.rt/10)}">RT ${f.rt}%</span>`:""}${f.local?`<span class="chip ${grade(f.local)}">MC ${f.local.toFixed(1)}</span>`:""}</div></div></div>
 <p class="synopsis">${esc(f.syn)}</p>
 ${f.says?`<div class="says-block"><div class="kicker">${t("mascot")}</div><p>“${esc(f.says)}”</p><div class="sig">— CINE · UPDATED ${esc(f.says_updated||"TODAY")}</div></div>`:""}
 ${f.trailer?`<div class="trailer"><div class="th">${artSVG(f,390,150)}<div class="play"><span>▶</span></div></div><div class="cap">${t("trailer")} · ${esc(f.title)}</div></div>`:""}
 <div class="showtimes"><div class="sec-label"><span>${t("showtimes")}</span><span class="count">${f.cinemas} CINEMAS</span></div>
 ${AREAS.map(a=>{const blocks=groups[a]||[]; if(!blocks.length)return "";
  return `<div class="st-area">${esc(a.toUpperCase())}</div>`+blocks.map(b=>{const c=cinById(b.cinema_id);
   return `<div class="st-cinema"><h4><a href="#/cinema/${c.id}">${esc(c.name)}</a></h4>
   <div class="cmeta">${c.type==="summer"?`<span class="chip amber">☀ ${t("openair")}</span>`:""}${state.near?`<span class="chip dim">${t("dist")(distKm(c))}</span>`:""}</div>
   ${b.days.map(d=>`<div class="dayrow"><div class="dl${d.date==="2026-11-05"?" today":""}">${dayLabel(d.date)}</div><div class="times">${d.times.map(s=>timeChip(s,d.date==="2026-11-05"&&s.t>NOW&&d.times.findIndex(x=>x.t>NOW)===d.times.indexOf(s))).join("")}</div></div>`).join("")}
   <a class="tickets-btn" href="${esc(c.ticket_url)}" target="_blank" rel="noopener">${t("tickets")}</a></div>`}).join("")}).join("")||`<div class="empty"><b>${t("noshow_t")}</b>${t("noshow_b")}</div>`}
 </div>`}
function notFoundHTML(){return headerHTML()+`<div class="empty" style="margin-top:40px"><div class="notfound">404</div><b>${t("notfound")}</b>That film or cinema isn’t in the guide.<br><br><a href="#/home/all" style="color:var(--amber);font-weight:700">← Back to tonight’s films</a></div>`}

/* ---------- cinema page ---------- */
function cinemaHTML(id){const c=cinById(id); if(!c)return notFoundHTML();
 const sched=DATA.cinema_schedule[c.id]||{};
 return headerHTML()+`<a class="backlink" href="#/home/cinemas">${t("back")}</a>
 <div class="cinhero"><h1>${esc(c.name)}</h1><div class="addr">${esc(c.area)} · ${t("halls")(c.halls)} · ${esc(c.address)}</div>
 <div class="contact">☎ ${esc(c.phone)} · <a href="https://${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website)}</a></div>
 <div class="chips-row">${c.type==="summer"?`<span class="chip amber">☀ ${t("openair")}</span>`:""}${c.formats.map(f=>`<span class="chip dim">${esc(f)}</span>`).join("")}<span class="chip dim">${c.type.replace("_"," ")}</span></div></div>
 <a class="tickets-btn" href="${esc(c.ticket_url)}" target="_blank" rel="noopener">${t("tickets")}</a>
 ${DAYS.map(d=>{const rows=sched[d]||[]; if(!rows.length)return "";
  return `<div class="daybox"><h3 class="${d==="2026-11-05"?"today":""}">${dayLabel(d)} · ${d.slice(5)}</h3>${rows.map(r=>{const f=filmById(r.film_id);
   return `<a class="dayfilm" href="#/film/${f.id}"><div class="thumb">${posterSVG(f)}</div><div><div class="t">${esc(f.title)}</div><div class="times">${r.times.map(s=>timeChip(s)).join("")}</div></div></a>`}).join("")}</div>`}).join("")||`<div class="empty"><b>No showtimes found</b></div>`}
 <p class="footnote">${t("attrib")}</p>`}

/* ---------- states ---------- */
function statesHTML(){return headerHTML()+`<div class="sec-label"><span>STATES WE WERE MISSING</span><span class="count">4</span></div>
 <div class="state-card"><h3><span class="dot">01 ·</span> Location denied</h3><p>Today a denied location fails silently. Now the app says so, and keeps working by area.</p>
 <div class="demo"><div class="banner"><div><b>${t("denied_t")}</b><span>${t("denied_b")}</span></div><button>${t("denied_cta")}</button></div></div></div>
 <div class="state-card"><h3><span class="dot">02 ·</span> Film, no showtimes</h3><p>No more bare heading. The state names the gap and points at tonight instead.</p>
 <div class="demo" style="text-align:left"><b>${t("noshow_t")}</b><p style="margin-top:4px">${t("noshow_b")}</p><p style="margin-top:10px"><a href="#/home/today" style="color:var(--amber);font-weight:700">See tonight →</a></p></div></div>
 <div class="state-card"><h3><span class="dot">03 ·</span> 404</h3><p>Unknown film or cinema gets a designed dead end, not the framework default.</p>
 <div class="demo"><div class="notfound">404</div><p style="margin-top:4px">${t("notfound")}</p></div></div>
 <div class="state-card"><h3><span class="dot">04 ·</span> Offline</h3><p>When the feed can’t load, the app shows the last good copy with its timestamp.</p>
 <div class="demo"><div class="offline-bar">● ${t("offline").toUpperCase()} · LAST UPDATED THU 19:00 · <span style="color:var(--amber)">${t("retry").toUpperCase()}</span></div></div></div>`}

/* ---------- wide ---------- */
function wideHTML(){const rows=DATA.films.slice(0,6).map(f=>filmRowHTML(f)).join("");
 return headerHTML()+`<div class="wide"><div class="sec-label"><span>WIDE VIEW · 1024px</span><span class="count">BONUS</span></div>
 <div class="wgrid"><div class="wcol"><h2>Tonight, at full width</h2><p style="color:var(--ink-dim);font-size:14px;line-height:1.6">The phone column grows into a three-across programme grid; the map docks beside the list instead of above it. Same data, same thumb-first order — nothing re-learned.</p>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px">${rows}</div></div>
 <div class="wcol wmap"><h2>Map, docked</h2>${cinemasHTML().split('<div class="area-h">')[0].replace('<div class="sec-label">','<div class="sec-label" style="display:none">')}</div></div></div>`}

/* ---------- router ---------- */
function render(keepScroll){const h=location.hash||"#/home/all"; const parts=h.replace(/^#\//,"").split("/");
 document.querySelector(".phone").classList.toggle("is-wide",parts[0]==="wide");
 const app=$("#app"); let html="";
 if(parts[0]==="film")html=filmHTML(parts[1]);
 else if(parts[0]==="cinema")html=cinemaHTML(parts[1]);
 else if(parts[0]==="states")html=statesHTML();
 else if(parts[0]==="wide")html=wideHTML();
 else{state.tab=["today","new","all","cinemas"].includes(parts[1])?parts[1]:"all"; html=homeHTML()}
 app.innerHTML=html;
 $$("#rail button").forEach(b=>{b.classList.toggle("on",b.dataset.view==="home"&&b.dataset.tab===state.tab&&parts[0]==="home");
  const ic=b.querySelector(".ic"); if(ic&&ic.nextSibling)ic.nextSibling.textContent=RAIL[state.lang][b.dataset.tab]});
 $("#foot").innerHTML=`CINE — a free, ad-free guide. No sign-in, no ads, tickets on outside sites.<br>${t("attrib")}`;
 if(!keepScroll)window.scrollTo(0,0)}
document.addEventListener("click",e=>{
 const lang=e.target.closest("[data-lang]"); if(lang){state.lang=lang.dataset.lang; render(); return}
 const sw=e.target.closest("[data-sw]"); if(sw){state[sw.dataset.sw==="summer"?"summer":"near"]=!state[sw.dataset.sw==="summer"?"summer":"near"]; render(); return}
 const day=e.target.closest("[data-day]"); if(day){state.day=day.dataset.day; render(); return}
 const rail=e.target.closest("#rail button"); if(rail){location.hash="#/home/"+rail.dataset.tab; return}
 if(e.target.id==="clearq"){state.q=""; render(); return}
 if(e.target.closest("[data-act=map]")){alert("Map expands to full screen in the app."); return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){state.q=e.target.value; const pos=e.target.selectionStart;
  const st=window.scrollY; render(true); window.scrollTo(0,st); const q2=$("#q"); if(q2){q2.focus(); q2.setSelectionRange(pos,pos)}}});
window.addEventListener("hashchange",render);
render();

</script>
